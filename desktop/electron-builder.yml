appId: io.github.aleixribera.drawer
productName: Drawer
copyright: Copyright (c) 2026 aleixribera
directories:
  output: dist
  buildResources: resources
files:
  - src/**
  - package.json
win:
  target: nsis
  icon: src/assets/icon.png
nsis:
  oneClick: true
  perMachine: false
  artifactName: Drawer-Setup-${version}.${ext}
linux:
  target: AppImage
  icon: src/assets/icon.png
  category: Utility
  synopsis: Your self-hosted drawer, on the desktop
  # No version in the name: the updater then replaces the file in place, so the path the hotkeys and the autostart
  # entry point at stays the same.
  artifactName: Drawer-${arch}.${ext}
publish:
  provider: github
  owner: aleixribera
  repo: drawer
  releaseType: release
